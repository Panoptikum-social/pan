<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - Panoptikum</title>
    <style>
      body { font-family: system-ui, sans-serif; display: flex; min-height: 100vh; margin: 0;
             align-items: center; justify-content: center; text-align: center; background: #f5f5f5; color: #333; }
      main { max-width: 28rem; padding: 1rem; }
      img { width: 96px; height: 96px; }
      button { font: inherit; padding: .5rem 1.25rem; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <img src="/images/android-chrome-192x192.png" alt="" />
      <h1>You are offline</h1>
      <p>Panoptikum needs a connection to load pages. Please check your network and try again.</p>
      <button onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
